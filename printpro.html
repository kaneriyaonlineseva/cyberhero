<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PrintPro - Best PDF Tools & Printing Solutions</title>
    <!-- Tailwind CSS + Alpine.js + Font Awesome -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .gradient-text {
            background: linear-gradient(135deg, #6366f1, #a855f7, #ec4899);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .service-card {
            transition: all 0.3s ease;
        }
        .service-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 25px -12px rgba(99, 102, 241, 0.3);
        }
    </style>
</head>
<body class="bg-gray-50" x-data="{ mobileMenu: false, paymentOpen: false }">

    <!-- Header -->
    <header class="bg-white shadow-sm sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center gap-2">
                <div class="w-9 h-9 rounded-lg bg-indigo-600 flex items-center justify-center"><i class="fa-solid fa-print text-white"></i></div>
                <span class="text-xl font-bold text-gray-800">Print<span class="gradient-text">Pro</span></span>
            </div>
            <div class="hidden md:flex gap-6">
                <a href="#" class="text-indigo-600 font-semibold">Home</a>
                <a href="#">Tools</a>
                <a href="#">Pricing</a>
                <a href="#">Contact</a>
            </div>
            <div class="flex gap-3">
                <button @click="paymentOpen = true" class="bg-indigo-100 text-indigo-600 px-4 py-2 rounded-full text-sm font-semibold hover:bg-indigo-600 hover:text-white transition"><i class="fa-solid fa-qrcode mr-1"></i> Pay</button>
                <button @click="mobileMenu = !mobileMenu" class="md:hidden"><i class="fa-solid fa-bars"></i></button>
            </div>
        </div>
        <div x-show="mobileMenu" x-cloak class="md:hidden bg-white border-t p-4 space-y-2">
            <a href="#" class="block py-2">Home</a><a href="#" class="block py-2">Tools</a><a href="#" class="block py-2">Pricing</a><a href="#" class="block py-2">Contact</a>
        </div>
    </header>

    <!-- Hero -->
    <section class="py-20 text-center bg-gradient-to-r from-indigo-50 to-purple-50">
        <h1 class="text-4xl font-bold">Transform Your <span class="gradient-text">Digital Documents</span></h1>
        <p class="text-gray-600 mt-2">PDF tools, passport photo, ID card — all in one place</p>
        <div class="max-w-md mx-auto mt-6"><input type="text" id="searchInput" placeholder="Search..." class="w-full p-3 rounded-full border shadow-sm"></div>
    </section>

    <!-- Services Grid -->
    <section class="py-12 max-w-6xl mx-auto px-4">
        <h2 class="text-2xl font-bold text-center mb-6">Our <span class="gradient-text">Services</span></h2>
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4" id="servicesGrid"></div>
    </section>

    <!-- Payment Modal -->
    <div x-show="paymentOpen" x-cloak class="fixed inset-0 bg-black/50 flex items-center justify-center z-50">
        <div class="bg-white rounded-2xl p-6 max-w-sm w-full">
            <h3 class="font-bold text-center">Scan to Pay</h3>
            <div class="bg-gray-100 p-4 rounded-xl my-4 flex justify-center"><canvas id="qrCanvas" width="180" height="180"></canvas></div>
            <button @click="paymentOpen = false" class="w-full bg-gray-200 py-2 rounded-lg">Close</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/qrious@4.0.2/dist/qrious.min.js"></script>
    <script>
        const services = [
            { name: "JPG to PDF", icon: "fa-file-pdf", color: "red" },
            { name: "Passport Photo", icon: "fa-id-card", color: "indigo" },
            { name: "Merge PDF", icon: "fa-object-group", color: "green" },
            { name: "ID Card Print", icon: "fa-credit-card", color: "purple" }
        ];
        const grid = document.getElementById('servicesGrid');
        services.forEach(s => { let d=document.createElement('div'); d.className='bg-white p-4 rounded-xl shadow text-center service-card'; d.innerHTML=`<i class="fa-regular ${s.icon} text-3xl text-${s.color}-500 mb-2 block"></i><span class="font-semibold">${s.name}</span>`; grid.appendChild(d); });
        document.getElementById('searchInput').addEventListener('input', e=>{ let q=e.target.value.toLowerCase(); document.querySelectorAll('#servicesGrid > div').forEach(c=>{ c.style.display=c.innerText.toLowerCase().includes(q)?'block':'none'; }); });
        window.addEventListener('open-payment-modal', ()=>{ if(typeof QRious!=='undefined') new QRious({element:document.getElementById('qrCanvas'), value:'upi://pay?pa=printpro@ybl&pn=PrintPro&cu=INR', size:180}); });
    </script>
</body>
</html>
